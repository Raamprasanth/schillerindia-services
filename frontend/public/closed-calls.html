<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>SchillerIndia - Call Register</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root,[data-theme="light"]{--bg:#f4f7fa;--surface:#ffffff;--surface2:#eaf1f6;--border:#d0e0ec;--accent:#0077cc;--accent2:#007a8a;--green:#059669;--amber:#d97706;--red:#cc0000;--text:#1a2a3a;--muted:#7a9ab0;--soft:#4a6a8a;--card:#ffffff;--shadow:rgba(0,80,120,0.08);--teal:#007a8a;}
[data-theme="dark"]{--bg:#0f1621;--surface:#1a2333;--surface2:#1e293b;--border:#2a3a52;--accent:#3b9eff;--accent2:#22d3ee;--green:#10b981;--amber:#f59e0b;--red:#f87171;--text:#e2eaf4;--muted:#4a6a8a;--soft:#7a9ab0;--card:#1a2333;--shadow:rgba(0,0,0,0.3);--teal:#22d3ee;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}
.sidebar{width:240px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:2px 0 12px var(--shadow);}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);background:linear-gradient(145deg,#450a0a,#b91c1c);}
.sidebar-logo{display:flex;align-items:center;gap:10px;}
.sidebar-logo-icon{width:36px;height:36px;background:rgba(255,255,255,0.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:#fff;}
.sidebar-logo-text{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#fff;}
.sidebar-logo-text .sub{font-size:10px;color:rgba(255,255,255,0.6);font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;}
.role-badge{margin:10px 20px 0;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:inline-block;}
.role-badge.admin{background:rgba(185,28,28,0.1);color:#b91c1c;border:1px solid rgba(185,28,28,0.25);}
.role-badge.employee{background:rgba(5,150,105,0.12);color:var(--green);border:1px solid rgba(5,150,105,0.3);}
.sidebar-nav{flex:1;padding:12px 10px;}
.nav-section{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;padding:10px 8px 5px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--soft);font-size:12.5px;font-weight:500;cursor:pointer;transition:all 0.2s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:'Plus Jakarta Sans',sans-serif;text-decoration:none;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(185,28,28,0.1);color:#b91c1c;font-weight:600;}
[data-theme="dark"] .nav-item.active{background:rgba(185,28,28,0.15);}
.nav-item .icon{font-size:13px;width:18px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--border);}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#b91c1c,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:var(--text);} .user-role{font-size:11px;color:var(--muted);}
.logout-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:11px;font-weight:600;transition:all 0.2s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px var(--shadow);}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;}
.breadcrumb a{color:var(--muted);text-decoration:none;}.breadcrumb a:hover{color:var(--accent);}
.breadcrumb .sep{color:var(--border);}
.topbar-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--text);}
.topbar-date{font-size:12px;color:var(--muted);margin-top:2px;}
.content{flex:1;padding:28px;overflow-y:auto;background:var(--bg);}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;border:1px solid var(--border);background:var(--surface2);color:var(--soft);font-family:'Plus Jakarta Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}.btn.primary:hover{opacity:0.88;}
.btn.success{background:var(--green);color:#fff;border-color:var(--green);}
.btn.danger{color:var(--red);border-color:rgba(204,0,0,0.3);background:none;}.btn.danger:hover{background:rgba(204,0,0,0.07);}
.btn.sm{padding:6px 14px;font-size:12px;}.btn.xs{padding:4px 10px;font-size:11px;border-radius:6px;}.btn:disabled{opacity:0.5;cursor:not-allowed;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px var(--shadow);transition:transform 0.2s;}
.stat-card:hover{transform:translateY(-1px);}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;}.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;font-size:13px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none;}
.search-box input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);}
.filter-sel{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--soft);font-family:'Plus Jakarta Sans',sans-serif;outline:none;cursor:pointer;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px var(--shadow);}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);}
.panel-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
.panel-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.table-wrap{overflow-x:auto;}
table.dt{width:100%;border-collapse:collapse;}
table.dt thead th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap;}
table.dt tbody td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
table.dt tbody tr:last-child td{border-bottom:none;}
table.dt tbody tr:hover td{background:var(--surface2);}
.table-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;background:var(--surface);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;display:block;}
.b-red{background:rgba(204,0,0,0.1);color:var(--red);}.b-red::before{background:var(--red);}
.b-amber{background:rgba(217,119,6,0.12);color:var(--amber);}.b-amber::before{background:var(--amber);}
.b-green{background:rgba(5,150,105,0.12);color:var(--green);}.b-green::before{background:var(--green);}
.b-blue{background:rgba(0,119,204,0.12);color:var(--accent);}.b-blue::before{background:var(--accent);}
.b-muted{background:var(--surface2);color:var(--muted);}.b-muted::before{background:var(--muted);}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--soft);border:1px solid var(--border);}
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,0.4);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:fadeUp 0.3s ease;box-shadow:0 20px 60px rgba(0,0,0,0.18);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--text);}
.modal-close{background:none;border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{padding:24px;}.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}.field.span2{grid-column:span 2;}
.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
.field input,.field select,.field textarea{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;font-size:13px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color 0.2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:80px;}
.form-err{font-size:12px;color:var(--red);margin-top:10px;display:none;}.form-err.show{display:block;}
.confirm-box{background:var(--surface);border:1px solid rgba(204,0,0,0.2);border-radius:14px;width:100%;max-width:380px;padding:28px;text-align:center;animation:fadeUp 0.3s ease;}
.confirm-icon{font-size:40px;margin-bottom:14px;}.confirm-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
.confirm-msg{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6;}.confirm-actions{display:flex;gap:10px;justify-content:center;}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:260px;animation:fadeUp 0.3s ease;box-shadow:0 8px 24px var(--shadow);}
.toast.success{border-color:rgba(5,150,105,0.4);}.toast.success .tdot{background:var(--green);}
.toast.error{border-color:rgba(204,0,0,0.4);}.toast.error .tdot{background:var(--red);}
.toast.info{border-color:rgba(0,119,204,0.4);}.toast.info .tdot{background:var(--accent);}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.empty-state{text-align:center;padding:60px 20px;}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:0.4;}
.empty-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}.empty-sub{font-size:13px;color:var(--muted);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
    </style>

<body>

<script>
const API_BASE='/api';
let items=[],filtered=[],editingId=null,isAdmin=false,currentUser={};
(function init(){
  const token=sessionStorage.getItem('schiller_token');
  if(!token){window.location.href='login.html';return;}
  currentUser=JSON.parse(sessionStorage.getItem('schiller_user')||'{}');
  const role=(sessionStorage.getItem('schiller_role')||currentUser.role||'').toLowerCase();
  isAdmin=role==='admin'||role==='superadmin';
  document.getElementById('dash-link').href=isAdmin?'admin-dashboard.html':'employee-dashboard.html';
  buildSidebar(isAdmin);
  const name=currentUser.name||'User';
  (document.getElementById('sb-name')||{}).textContent =name;
  (document.getElementById('sb-avatar')||{}).textContent =name.charAt(0).toUpperCase();
  (document.getElementById('sb-role-txt')||{}).textContent =isAdmin?'Administrator':'Employee';
  const badge=document.getElementById('sb-role-badge');
  badge.textContent=isAdmin?'Admin':'Employee';
  badge.className='role-badge '+(isAdmin?'admin':'employee');
  (document.getElementById('page-date')||{}).textContent =new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  loadItems();
})();
function getToken(){return sessionStorage.getItem('schiller_token')||'';}
function authHeaders(){return {'Content-Type':'application/json',Authorization:'Bearer '+getToken()};}
function buildSidebar(admin){
  document.getElementById('sidebar-nav').innerHTML=admin?`    <div class="nav-section">Main</div>

    <a class="nav-item" href="company-section.html"><span class="icon">&#127970;</span> Company</a>
    <a class="nav-item" href="engineer-section.html"><span class="icon">&#128119;</span> Engineers</a>
    <a class="nav-item" href="dealer-section.html"><span class="icon">&#129309;</span> Dealers</a>
    <div class="nav-section">Service</div>
    <a class="nav-item" href="service-list.html"><span class="icon">&#128225;</span> Services</a>
    <a class="nav-item" href="pending-frn.html"><span class="icon">&#128221;</span> Pending FRN</a>
    <a class="nav-item" href="ob-pending.html"><span class="icon">&#128194;</span> OB Pending</a>
    <a class="nav-item" href="estimation-pending.html"><span class="icon">&#128203;</span> SO Pending</a>
        <a class="nav-item" href="under-repair.html"><span class="icon">&#128736;&#65039;</span> Under Repair</a>
    <a class="nav-item" href="closed-frn.html"><span class="icon">&#9989;</span> Closed FRN</a>
    <a class="nav-item" href="sc-completed-frn.html"><span class="icon">&#9989;</span> SC_Completed FRN</a>
    <a class="nav-item" href="cer.html"><span class="ico">&#128274;</span> Closed Ext Rep</a>
    <a class="nav-item" href="completed-frn.html"><span class="icon">&#9989;</span> Completed FRN</a>
    <a class="nav-item active" href="call-register.html"><span class="icon">&#128222;</span> Call Register</a>
    <a class="nav-item" href="aclose.html"><span class="icon">&#9989;</span> Closed Calls</a>
    <div class="nav-section">Activity</div>
    <button class="nav-group-toggle" id="ar-toggle" onclick="toggleAR()"><span class="icon">&#128196;</span> Activity Register <span class="caret">&#9656;</span></button>

async function loadItems(){
  document.getElementById('pg-tbody').innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">&#9203; Loading...</td></tr>';
  try{
    const res=await fetch(API_BASE+'/calls',{headers:authHeaders(),signal:AbortSignal.timeout(6000)});
    const data=await res.json();
    if(!res.ok) throw new Error(data.message||'HTTP '+res.status);
    items=Array.isArray(data)?data:[];
    updateStats();filterItems();
    (document.getElementById('pg-sync')||{}).textContent ='Synced: '+new Date().toLocaleTimeString('en-IN');
  }catch(e){
    items=getMock();updateStats();filterItems();
    showToast('Offline mode - '+e.message,'error');
  }
}
function getMock(){return [
        {_id:'c1',callId:'CALL-1042',customer:'Rahul Industries',phone:'9876543210',engineer:'Ravi Shankar',type:'Complaint',datetime:new Date(Date.now()-1*3600e3).toISOString(),status:'Open'},

        {_id:'c3',callId:'CALL-1040',customer:'City Hospital',phone:'9812345678',engineer:'Meena Kumari',type:'Query',datetime:new Date(Date.now()-5*3600e3).toISOString(),status:'Escalated'},
        {_id:'c4',callId:'CALL-1039',customer:'Sunrise Med',phone:'9988776655',engineer:'Binod Kumar',type:'Complaint',datetime:new Date(Date.now()-8*3600e3).toISOString(),status:'Open'},
        {_id:'c5',callId:'CALL-1038',customer:'BlueStar Hosp',phone:'9765432109',engineer:'Ashok Kumar',type:'AMC Query',datetime:new Date(Date.now()-10*3600e3).toISOString(),status:'Resolved'},
        {_id:'c6',callId:'CALL-1037',customer:'Apex Medics',phone:'9654321098',engineer:'Deepa Thomas',type:'Service Request',datetime:new Date(Date.now()-24*3600e3).toISOString(),status:'Open'},
    ];}

function formatDateTime(dt){if(!dt)return'-';const d=new Date(dt);return isNaN(d)?'-':d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function resolveCall(id){
  const item=items.find(x=>x._id===id); if(item){item.status='Resolved';updateStats();filterItems();showToast('Call closed!','success');}
}
function updateStats(){
  (document.getElementById('st-total')||{}).textContent =items.length;
  (document.getElementById('st-open')||{}).textContent =items.filter(x=>x.status==='Open').length;
  (document.getElementById('st-resolved')||{}).textContent =items.filter(x=>x.status==='Resolved').length;
  (document.getElementById('st-escalated')||{}).textContent =items.filter(x=>x.status==='Escalated').length;
}
function filterItems(){
  const q=document.getElementById('pg-search').value.toLowerCase();
  filtered=items.filter(d=>JSON.stringify(d).toLowerCase().includes(q));
  (document.getElementById('pg-summary')||{}).textContent =q?`${filtered.length} result${filtered.length!==1?'s':''} filtered`:'';
  renderTable();
}
function renderRow(d,i){
      const sc={Open:'b-amber',Resolved:'b-green',Escalated:'b-red'}[d.status]||'b-muted';
      return `<tr>
        <td><code style="background:var(--surface2);padding:2px 7px;border-radius:5px;font-size:11px;">${d.callId||'-'}</code></td>
        <td><strong>${esc(d.customer||'-')}</strong></td>
        <td style="font-size:12px;font-family:monospace;">${esc(d.phone||'-')}</td>
        <td style="color:var(--muted);font-size:12px;">${esc(d.engineer||'-')}</td>
        <td><span class="chip">${esc(d.type||'-')}</span></td>
        <td style="color:var(--muted);font-size:12px;">${formatDateTime(d.datetime)}</td>
        <td><span class="badge ${sc}">${d.status||'-'}</span></td>
        <td><div style="display:flex;gap:4px;">
          <button class="btn xs" onclick="openEdit('${d._id}')">&#9998;</button>
          ${d.status!=='Resolved'?`<button class="btn xs success" onclick="resolveCall('${d._id}')">&#9989; Close</button>`:''}
          ${isAdmin?`<button class="btn xs danger" onclick="confirmDel('${d._id}','${esc(d.customer||'')}')">&#128465;</button>`:''}
        </div></td>
      </tr>`;}
function renderTable(){
  (document.getElementById('pg-footer')||{}).textContent =`Showing ${filtered.length} of ${items.length} record${items.length!==1?'s':''}`;
  const tbody=document.getElementById('pg-tbody');
  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:50px;color:var(--muted);">No records found.</td></tr>';return;
  }
  tbody.innerHTML=filtered.map((d,i)=>renderRow(d,i)).join('');
}
function openAdd(){
  editingId=null;
  (document.getElementById('modal-title')||{}).textContent ='Log New Call';
  (document.getElementById('m-save-btn')||{}).textContent ='&#128190; Save';
  document.getElementById('m-err').classList.remove('show');
  ['m-customer','m-phone','m-engineer','m-datetime'].forEach(id=>document.getElementById(id).value='');
  openModal('modal-main');
}
function openEdit(id){
  const f=items.find(x=>x._id===id);if(!f)return;
  editingId=id;
  (document.getElementById('modal-title')||{}).textContent ='Edit Record';
  (document.getElementById('m-save-btn')||{}).textContent ='&#128190; Update';
  document.getElementById('m-err').classList.remove('show');
  document.getElementById('m-customer').value=f.customer||'';document.getElementById('m-phone').value=f.phone||'';document.getElementById('m-engineer').value=f.engineer||'';document.getElementById('m-type').value=f.type||'Complaint';document.getElementById('m-status').value=f.status||'Open';document.getElementById('m-datetime').value=f.datetime?new Date(f.datetime).toISOString().slice(0,16):'';
  openModal('modal-main');
}
async function saveItem(){
  const errEl=document.getElementById('m-err');
  const btn=document.getElementById('m-save-btn');
  if(!document.getElementById('m-customer').value.trim()){errEl.textContent='Please fill all required fields.';errEl.classList.add('show');return;}
  errEl.classList.remove('show');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Saving...';
  const payload={customer:document.getElementById('m-customer').value.trim(),phone:document.getElementById('m-phone').value.trim(),engineer:document.getElementById('m-engineer').value.trim(),type:document.getElementById('m-type').value,status:document.getElementById('m-status').value,datetime:document.getElementById('m-datetime').value||new Date().toISOString()};
  try{
    let res,saved;
    if(editingId){
      res=await fetch(API_BASE+'/calls/'+editingId,{method:'PUT',headers:authHeaders(),body:JSON.stringify(payload)});
      saved=await res.json();if(!res.ok)throw new Error(saved.message||'Failed');
      const idx=items.findIndex(x=>x._id===editingId);if(idx!==-1)items[idx]=saved;
      showToast('Updated!','success');
    }else{
      res=await fetch(API_BASE+'/calls',{method:'POST',headers:authHeaders(),body:JSON.stringify(payload)});
      saved=await res.json();if(!res.ok)throw new Error(saved.message||'Failed');
      items.unshift(saved);showToast('Added!','success');
    }
    closeModal('modal-main');updateStats();filterItems();
  }catch(e){
    // Optimistic local save
    const mock={_id:'local_'+Date.now(),...payload};
    if(editingId){const idx=items.findIndex(x=>x._id===editingId);if(idx!==-1)items[idx]={...items[idx],...payload};}
    else{items.unshift(mock);}
    closeModal('modal-main');updateStats();filterItems();
    showToast('Saved locally (server offline)','info');
  }
  btn.disabled=false;btn.textContent=editingId?'&#128190; Update':'&#128190; Save';
}
function confirmDel(id,name){
  (document.getElementById('confirm-msg')||{}).textContent =`"${name}" will be permanently removed.`;
  document.getElementById('confirm-ok').onclick=async()=>{
    closeModal('modal-confirm');
    try{await fetch(API_BASE+'/calls/'+id,{method:'DELETE',headers:authHeaders()});}catch(e){}
    items=items.filter(x=>x._id!==id);updateStats();filterItems();
    showToast('Deleted.','success');
  };
  openModal('modal-confirm');
}
function formatDate(dt){if(!dt)return'-';const d=new Date(dt);return isNaN(d)?'-':d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
function showToast(msg,type='success'){const wrap=document.getElementById('toast-wrap');const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=`<span class="tdot"></span>${msg}`;wrap.appendChild(el);setTimeout(()=>el.remove(),3200);}
function toggleAR(){ var btn=document.getElementById('ar-toggle'); var panel=document.getElementById('ar-children'); if(!btn||!panel)return; btn.classList.toggle('open'); panel.classList.toggle('open'); }
function logout(){sessionStorage.clear(); localStorage.clear();window.location.href='login.html';}
