<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Database Backup</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --accent-hover: #3182ce;
      --danger: #f85149;
      --border: #30363d;
      --card-bg: #161b22;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--danger);
    }
    p {
      font-size: 14px;
      color: #8b949e;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg);
      color: var(--fg);
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--accent-hover);
    }
    .error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    #download-section {
      display: none;
      text-align: center;
    }
    #download-btn {
      background-color: #238636;
      margin-top: 15px;
    }
    #download-btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Emergency Data Export</h1>
    <p>Use this page to download a complete Excel backup if the main application UI is unavailable.</p>

    <div id="error-message" class="error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-btn">Authenticate</button>
    </form>

    <div id="download-section">
      <div style="color: #3fb950; font-weight: 600; margin-bottom: 10px;">Authenticated successfully!</div>
      <button id="download-btn">Download Full Excel Backup</button>
    </div>
  </div>

  <script>
    let authToken = '';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-message');
      const loginBtn = document.getElementById('login-btn');

      errorEl.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.message || 'Authentication failed');
        }

        if (data.user?.role !== 'admin' && data.user?.role !== 'superadmin') {
           throw new Error('Only admins can download emergency backups.');
        }

        authToken = data.token;
        
        // Hide login, show download
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('download-section').style.display = 'block';

      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Authenticate';
      }
    });

    document.getElementById('download-btn').addEventListener('click', async () => {
      const btn = document.getElementById('download-btn');
      const errorEl = document.getElementById('error-message');
      
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Generating Excel Backup (This may take a minute)...';

      try {
        const res = await fetch('/api/backup/excel', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });

        if (!res.ok) {
          let errText = 'Failed to generate backup.';
          try {
            const data = await res.json();
            errText = data.message || errText;
          } catch(e) {}
          throw new Error(errText);
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        
        // Get filename from header if possible
        let filename = `schiller-emergency-backup-${new Date().toISOString().slice(0, 10)}.xlsx`;
        const disposition = res.headers.get('Content-Disposition');
        if (disposition && disposition.indexOf('filename=') !== -1) {
          const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
          if (matches != null && matches[1]) { 
            filename = matches[1].replace(/['"]/g, '');
          }
        }

        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(url);
        a.remove();
        
        btn.textContent = 'Downloaded Successfully!';
        setTimeout(() => {
           btn.textContent = 'Download Full Excel Backup';
           btn.disabled = false;
        }, 3000);

      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Download Full Excel Backup';
      }
    });
  </script>
</body>
</html>
