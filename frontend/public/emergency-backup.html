<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Database Backup</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --danger: #f85149;
      --border: #30363d;
      --card-bg: #161b22;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--danger);
    }
    p {
      font-size: 14px;
      color: #8b949e;
      text-align: center;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2ea043;
    }
    button:disabled {
      background-color: #1a5c27;
      color: #8b949e;
      cursor: not-allowed;
    }
    .error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Emergency Data Export</h1>
    <p>Use this page to download a complete Excel backup if the main application UI is unavailable. No authentication is required.</p>

    <div id="error-message" class="error"></div>

    <button id="download-btn">Download Full Excel Backup</button>
  </div>

  <script>
    document.getElementById('download-btn').addEventListener('click', async () => {
      const btn = document.getElementById('download-btn');
      const errorEl = document.getElementById('error-message');
      
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Generating Excel Backup (This may take a minute)...';

      try {
        const res = await fetch('/api/backup/excel', {
          method: 'GET'
        });

        if (!res.ok) {
          let errText = 'Failed to generate backup.';
          try {
            const data = await res.json();
            errText = data.message || errText;
          } catch(e) {}
          throw new Error(errText);
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        
        // Get filename from header if possible
        let filename = `schiller-emergency-backup-${new Date().toISOString().slice(0, 10)}.xlsx`;
        const disposition = res.headers.get('Content-Disposition');
        if (disposition && disposition.indexOf('filename=') !== -1) {
          const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
          if (matches != null && matches[1]) { 
            filename = matches[1].replace(/['"]/g, '');
          }
        }

        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(url);
        a.remove();
        
        btn.textContent = 'Downloaded Successfully!';
        setTimeout(() => {
           btn.textContent = 'Download Full Excel Backup';
           btn.disabled = false;
        }, 3000);

      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Download Full Excel Backup';
      }
    });
  </script>
</body>
</html>
