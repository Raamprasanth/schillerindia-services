<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SchillerIndia - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --blue-dark:#002d5c;
      --blue:#0068b5;
      --blue-mid:#0052a3;
      --blue-light:#e8f3fb;
      --blue-glow:rgba(0,104,181,0.18);
      --red:#cc0000;
      --repair:#059669;
      --text:#0f2236;
      --muted:#6b8ca8;
      --card:#ffffff;
      --border:rgba(0,104,181,0.18);
    }
    html,body{min-height:100vh;font-family:'DM Sans',sans-serif;background:#f0f4f8;color:var(--text);overflow-x:hidden;}

    /* BG — clean white with subtle pattern */
    .bg-grid{position:fixed;inset:0;z-index:0;background:#f0f4f8;}
    .bg-grid::after{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(0,104,181,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,104,181,0.05) 1px,transparent 1px);
      background-size:48px 48px;}
    .bg-glow{position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 60% 50% at 15% 30%,rgba(0,104,181,0.06) 0%,transparent 70%),
        radial-gradient(ellipse 50% 50% at 85% 70%,rgba(0,104,181,0.05) 0%,transparent 70%);
    }

    /* LAYOUT */
    .page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}

    /* CARD */
    .card{
      background:#ffffff;
      border:1px solid rgba(0,104,181,0.15);
      border-radius:12px;
      width:100%;max-width:430px;
      padding:0;
      overflow:hidden;
      box-shadow:0 8px 40px rgba(0,60,120,0.12),0 2px 8px rgba(0,60,120,0.06);
      animation:rise 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}

    /* CARD TOP BANNER — matches sidebar header */
    .card-top{
      background:linear-gradient(145deg,#002d5c,#0068b5);
      padding:28px 36px 24px;
      position:relative;
      overflow:hidden;
      transition:background 0.4s ease;
    }
    .card-top::before{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(255,255,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.06) 1px,transparent 1px);
      background-size:32px 32px;}
    .card-top::after{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(14,165,233,0.15);pointer-events:none;}

    /* LOGO */
    .logo{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
    .organ-logo{display:flex;gap:3px;border-radius:10px;overflow:hidden;height:52px;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,0.35);}
    .organ-panel{width:48px;height:52px;display:flex;align-items:center;justify-content:center;}
    .op-yellow{background:#F5C518;}
    .op-orange{background:#F4845F;}
    .op-red{background:#C0392B;}
    @keyframes heartpulse{0%,65%,100%{transform:scale(1)}15%{transform:scale(1.30)}35%{transform:scale(1.10)}50%{transform:scale(1.22)}}
    @keyframes lungbreathe{0%,100%{transform:scale(1)}50%{transform:scaleX(1.10) scaleY(1.08)}}
    @keyframes anabeat{0%,60%,100%{transform:scale(1) rotate(-4deg)}18%{transform:scale(1.26) rotate(-4deg)}38%{transform:scale(1.08) rotate(-4deg)}}
    .anim-heart{animation:heartpulse 1.4s ease-in-out infinite;transform-origin:center;}
    .anim-lungs{animation:lungbreathe 2.8s ease-in-out infinite;transform-origin:center bottom;}
    .anim-ana{animation:anabeat 1.4s ease-in-out infinite 0.2s;transform-origin:center;}
    .logo-text .name{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:0.06em;}
    .logo-text .name span{color:rgba(14,165,233,0.9);}
    .logo-text .sub{font-size:10px;color:rgba(255,255,255,0.55);letter-spacing:0.18em;text-transform:uppercase;margin-top:2px;}

    /* HEADING inside top banner */
    .card-top h1{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:#fff;margin:18px 0 4px;position:relative;z-index:1;}
    .card-top .subtitle{font-size:12.5px;color:rgba(255,255,255,0.6);position:relative;z-index:1;}

    /* CARD BODY */
    .card-body{padding:28px 36px 32px;background:#ffffff;}

    /* FIELDS */
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
    .field-wrap{position:relative;}
    .field-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.35;pointer-events:none;}
    .field input,.field select{
      width:100%;padding:11px 14px 11px 38px;
      background:#f4f8fc;
      border:1.5px solid #ccdde8;
      border-radius:7px;color:var(--text);
      font-family:'DM Sans',sans-serif;font-size:14px;
      outline:none;transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
      appearance:none;-webkit-appearance:none;
    }
    .field select{cursor:pointer;}
    .select-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:10px;color:var(--muted);}
    .field input.has-toggle{padding-right:44px;}
    .pass-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:6px;background:transparent;color:#5f7f99;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s,color 0.2s;}
    .pass-toggle:hover,.pass-toggle:focus-visible{background:rgba(0,104,181,0.1);color:var(--blue);outline:none;}
    .pass-toggle svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
    .field input::placeholder{color:#a0b8cc;}
    .field input:focus,.field select:focus{border-color:var(--blue);background:#eef5fc;box-shadow:0 0 0 3px rgba(0,104,181,0.1);}
    .field input.err{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(204,0,0,0.1)!important;}

    /* MESSAGE */
    .msg{display:none;padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:16px;border-left:3px solid;line-height:1.5;}
    .msg.show-err{display:block;background:rgba(204,0,0,0.07);border-color:var(--red);color:#aa2020;}
    .msg.show-ok{display:block;background:rgba(0,104,181,0.07);border-color:var(--blue);color:#004a8a;}

    /* BUTTON */
    .btn{
      width:100%;padding:13px;margin-top:6px;
      background:var(--red);color:#fff;
      font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;
      letter-spacing:0.14em;text-transform:uppercase;
      border:none;border-radius:7px;cursor:pointer;
      transition:filter 0.2s,transform 0.15s,box-shadow 0.2s;
      box-shadow:0 4px 20px rgba(204,0,0,0.2);
    }
    .btn.emp{background:linear-gradient(135deg,#002d5c,#0068b5);box-shadow:0 4px 20px rgba(0,104,181,0.35);}
    .btn.sc{background:var(--blue);box-shadow:0 4px 20px rgba(0,104,181,0.3);}
    .btn.repair{background:linear-gradient(135deg,#052e16,#059669);box-shadow:0 4px 20px rgba(5,150,105,0.35);}
    .btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
    .btn:active:not(:disabled){transform:scale(0.98);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;}

    /* DIVIDER */
    .divider{height:1px;background:#ccdde8;margin:22px 0;}

    .back-link{text-align:center;font-size:12.5px;color:var(--muted);}
    .back-link a{color:var(--blue);text-decoration:none;font-weight:600;}
    .back-link a:hover{opacity:0.75;}

    .division-overlay{position:fixed;inset:0;background:rgba(8,20,40,0.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:40;padding:20px;}
    .division-overlay.open{display:flex;}
    .division-modal{width:100%;max-width:420px;background:#fff;border:1px solid rgba(0,104,181,0.15);border-radius:14px;box-shadow:0 16px 48px rgba(0,60,120,0.18);overflow:hidden;}
    .division-modal-top{padding:22px 24px 18px;background:linear-gradient(145deg,#002d5c,#0068b5);color:#fff;}
    .division-modal-top h2{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;}
    .division-modal-top p{font-size:12.5px;color:rgba(255,255,255,0.72);margin-top:4px;}
    .division-modal-body{padding:22px 24px 24px;}
    .division-help{font-size:13px;line-height:1.55;color:var(--soft);margin-bottom:16px;}
    .division-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
    .division-option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid #ccdde8;border-radius:10px;background:#f8fbff;cursor:pointer;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;}
    .division-option:hover{border-color:var(--blue);background:#eef5fc;}
    .division-option input{accent-color:var(--blue);cursor:pointer;}
    .division-option span{font-size:14px;font-weight:600;color:var(--text);}
    .division-modal-actions{display:flex;justify-content:flex-end;}
    .division-modal-actions .btn{margin-top:0;}

    @media(max-width:480px){.card-top{padding:22px 22px 20px;}.card-body{padding:22px 22px 28px;}}
  </style>
  <link rel="stylesheet" href="global-typography.css">
  <link rel="stylesheet" href="employee-theme.css">
  <script src="employee-theme.js"></script>
  <link rel="stylesheet" href="brand-logo.css">
  <script src="brand-logo.js" defer></script>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="page">
  <div class="card">

    <!-- Blue top banner -->
    <div class="card-top">
      <div class="logo">
      <div class="organ-logo">
        <div class="organ-panel op-yellow">
          <svg class="anim-heart" viewBox="0 0 40 38" width="30" height="28" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 34 C18 32 4 23 4 13.5 C4 8 8.5 4.5 14 4.5 C17 4.5 19.2 6.2 20 8 C20.8 6.2 23 4.5 26 4.5 C31.5 4.5 36 8 36 13.5 C36 23 22 32 20 34Z" fill="#E8266E" stroke="#B0104A" stroke-width="0.8"/>
            <ellipse cx="14" cy="11" rx="3" ry="2.5" fill="rgba(255,255,255,0.3)" transform="rotate(-20 14 11)"/>
          </svg>
        </div>
        <div class="organ-panel op-orange">
          <svg class="anim-lungs" viewBox="0 0 40 38" width="30" height="28" xmlns="http://www.w3.org/2000/svg">
            <rect x="18.5" y="2.5" width="3" height="9" rx="1.5" fill="#5B2C6F"/>
            <path d="M18.5 10 C14 10 9 12 7 16" stroke="#5B2C6F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path d="M21.5 10 C26 10 31 12 33 16" stroke="#5B2C6F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <ellipse cx="9.5" cy="24" rx="8" ry="11.5" fill="#7D3C98" opacity="0.9"/>
            <ellipse cx="30.5" cy="24" rx="8" ry="11.5" fill="#7D3C98" opacity="0.9"/>
            <ellipse cx="9.5" cy="27" rx="5.5" ry="7.5" fill="#9B59B6" opacity="0.55"/>
            <ellipse cx="30.5" cy="27" rx="5.5" ry="7.5" fill="#9B59B6" opacity="0.55"/>
          </svg>
        </div>
        <div class="organ-panel op-red">
          <svg class="anim-ana" viewBox="0 0 40 38" width="30" height="28" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 34 C17 31 7 23 5.5 15 C4.5 9 8.5 5 14 5 C17 5 19 7 20 9.5 C21 7 23.5 5 27 5 C32.5 5 35.5 10 34 16 C32.5 23 24 31 20 34Z" fill="#C0392B" stroke="#7B241C" stroke-width="0.8"/>
            <path d="M22 8 Q22 3 26 2.5 Q30.5 2 31 5 Q31.5 7.5 28 8" stroke="#641E16" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M20 9.5 Q18 6 15 5 Q12 4 10 6" stroke="#922B21" stroke-width="2" fill="none" stroke-linecap="round"/>
            <line x1="24.5" y1="6.5" x2="24.5" y2="2" stroke="#4A4E69" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12.5 14 Q20 11 27.5 15" stroke="#7B241C" stroke-width="0.6" fill="none" opacity="0.45"/>
            <ellipse cx="13" cy="12.5" rx="3.5" ry="2.5" fill="rgba(255,200,190,0.22)" transform="rotate(-25 13 12.5)"/>
          </svg>
        </div>
      </div>
      <div class="logo-text">
        <div class="name">Schiller<span>India</span></div>
        <div class="sub">Services Portal</div>
      </div>
    </div><!-- /logo -->

      <h1>Sign In</h1>
      <p class="subtitle">Select your role and enter your credentials</p>
    </div><!-- /card-top -->

    <div class="card-body">

    <!-- User Type -->
    <div class="field">
      <label>User Type</label>
      <div class="field-wrap">
        <span class="ico">🧑‍&#128187;</span>
        <select id="f-role" onchange="switchRole(this.value)">
          <option value="employee" selected>&#128100; Service Team</option>
          <option value="fqc">&#129514; FQC</option>
          <option value="pt">&#128202; Product Team</option>
          <option value="service_coordinator">&#128203; Service Co</option>
          <option value="repair">&#128295; Repair Team</option>
          <option value="admin">🛡 Admin</option>
        </select>
        <span class="select-arrow">▼</span>
      </div>
    </div>

    <!-- Message Box -->
    <div class="msg" id="msg"></div>

    <!-- Email -->
    <div class="field">
      <label>User Name</label>
      <div class="field-wrap">
        <span class="ico">✉</span>
        <input type="text" id="f-email" placeholder="Enter your User Name or ID" autocomplete="username"/>
      </div>
    </div>

    <!-- Password -->
    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <span class="ico">&#128274;</span>
        <input type="password" id="f-pass" class="has-toggle" placeholder="Enter your password" autocomplete="current-password"/>
        <button type="button" class="pass-toggle" id="pass-toggle" onclick="togglePassword()" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <!-- Login Button -->
    <button class="btn emp" id="login-btn" onclick="doLogin()">Login as Service Team</button>

    <div class="divider"></div>
    <div class="back-link"><a href="index.html">← Back to Home</a></div>

    </div><!-- /card-body -->
  </div>
</div>

<div class="division-overlay" id="division-overlay">
  <div class="division-modal">
    <div class="division-modal-top">
      <h2>Select Division</h2>
      <p>Choose the division workspace to open now</p>
    </div>
    <div class="division-modal-body">
      <div class="division-help">Your account has access to more than one division. Pick one now so only that division's entries are shown.</div>
      <div class="msg" id="division-msg"></div>
      <div class="division-list" id="division-list"></div>
      <div class="division-modal-actions">
        <button class="btn emp" id="division-continue-btn" onclick="confirmDivisionChoice()">Continue</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API = '/api';
  const ACTIVE_DIVISION_KEY = 'schiller_active_division';
  let currentRole = 'employee';
  let pendingLoginRedirect = '';
  let pendingDivisionChoices = [];

  /* ── Switch role tab ── */
  function switchRole(role) {
    currentRole = role;

    // Style button based on role
    const btn = document.getElementById('login-btn');
    btn.style.background = '';
    btn.style.boxShadow  = '';

    if (role === 'admin') {
      btn.className   = 'btn';
      btn.textContent = 'Login as Admin';
    } else if (role === 'employee') {
      btn.className   = 'btn emp';
      btn.textContent = 'Login as Service Team';
    } else if (role === 'service_coordinator') {
      btn.className   = 'btn sc';
      btn.textContent = 'Login as Service Co';
    } else if (role === 'repair') {
      btn.className   = 'btn repair';
      btn.textContent = 'Login as Repair Team';
    } else if (role === 'fqc') {
      btn.className   = 'btn';
      btn.style.background = '#7c3aed';
      btn.style.boxShadow  = '0 4px 20px rgba(124,58,237,0.2)';
      btn.textContent = 'Login as FQC';
    } else if (role === 'pt') {
      btn.className   = 'btn pt';
      btn.textContent = 'Login as Product Team';
    }

    // Clear state
    clearErrors();
    document.getElementById('f-email').value = '';
    document.getElementById('f-pass').value  = '';
    document.getElementById('f-email').focus();
  }



  /* ── Clear all error state ── */
  function clearErrors() {
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    msg.textContent = '';
    document.getElementById('f-email').classList.remove('err');
    document.getElementById('f-pass').classList.remove('err');
  }

  /* ── Show message ── */
  function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.className = type === 'err' ? 'msg show-err' : 'msg show-ok';
    msg.innerHTML = text;
  }
  function togglePassword() {
    const passEl = document.getElementById('f-pass');
    const btn = document.getElementById('pass-toggle');
    const visible = passEl.type === 'text';
    passEl.type = visible ? 'password' : 'text';
    btn.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    btn.setAttribute('title', visible ? 'Show password' : 'Hide password');
    btn.innerHTML = visible
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="3"></circle></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="3"></circle><path d="M4 4l16 16"></path></svg>';
    passEl.focus();
  }
  function _esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function getAssignedDivisions(user) {
    const values = [];
    if (Array.isArray(user?.divisions)) values.push(...user.divisions);
    if (Array.isArray(user?.assignedDivisions)) values.push(...user.assignedDivisions);
    if (user?.division) values.push(user.division);
    return [...new Set(values.map(v => String(v || '').trim()).filter(Boolean))];
  }
  function getRedirectForRole(role) {
    if (role === 'admin' || role === 'superadmin') return 'admin-dashboard.html';
    if (role === 'employee') return 'employee-dashboard.html';
    if (role === 'service_coordinator') return 'Sc-dashboard.html';
    if (role === 'fqc') return 'fqc-dashboard.html';
    if (role === 'pt') return 'pt-dashboard.html';
    if (role === 'repair') return 'Repair-dashboard.html';
    return '';
  }
  function showDivisionMsg(text, type) {
    const msg = document.getElementById('division-msg');
    msg.className = type === 'err' ? 'msg show-err' : 'msg show-ok';
    msg.innerHTML = text;
  }
  function openDivisionChooser(user, redirectTarget) {
    pendingLoginRedirect = redirectTarget;
    pendingDivisionChoices = getAssignedDivisions(user);
    const list = document.getElementById('division-list');
    list.innerHTML = pendingDivisionChoices.map((division, index) => `
      <label class="division-option">
        <input type="radio" name="division-choice" value="${_esc(division)}"${index === 0 ? ' checked' : ''}/>
        <span>${_esc(division)}</span>
      </label>
    `).join('');
    const msg = document.getElementById('division-msg');
    msg.className = 'msg';
    msg.textContent = '';
    document.getElementById('division-overlay').classList.add('open');
  }
  function confirmDivisionChoice() {
    const selected = document.querySelector('input[name="division-choice"]:checked');
    if (!selected) {
      showDivisionMsg('&#9888; Please choose a division to continue.', 'err');
      return;
    }
    localStorage.setItem(ACTIVE_DIVISION_KEY, selected.value);
    window.location.href = pendingLoginRedirect || 'employee-dashboard.html';
  }

  /* ── Helper: get button label for current role ── */
  function btnLabel() {
    if (currentRole === 'admin')    return 'Login as Admin';
    if (currentRole === 'employee') return 'Login as Employee';
    if (currentRole === 'service_coordinator') return 'Login as Service Coordinator';
    if (currentRole === 'repair')   return 'Login as Repair Team';
    if (currentRole === 'fqc')      return 'Login as FQC';
    if (currentRole === 'pt')       return 'Login as PT';
    return 'Login';
  }

  /* ── Main login handler ── */
  async function doLogin() {
    clearErrors();

    const emailEl = document.getElementById('f-email');
    const passEl  = document.getElementById('f-pass');
    const btn     = document.getElementById('login-btn');
    const email   = emailEl.value.trim();
    const pass    = passEl.value.trim();

    // ── Validation ──
    let hasErr = false;
    if (!email) { emailEl.classList.add('err'); hasErr = true; }
    if (!pass)  { passEl.classList.add('err');  hasErr = true; }
    if (hasErr) {
      showMsg('&#9888; Please enter both User Name and password.', 'err');
      return;
    }
    if (pass.length < 4) {
      passEl.classList.add('err');
      showMsg('&#9888; Password must be at least 4 characters.', 'err');
      return;
    }

    // ── Call backend ──
    btn.disabled    = true;
    btn.textContent = 'Verifying...';

    try {
      // Same endpoint pattern for all three roles
      const endpoint = currentRole === 'admin'
        ? `${API}/auth/admin/login`
        : currentRole === 'employee'
          ? `${API}/auth/employee/login`
          : currentRole === 'service_coordinator'
            ? `${API}/auth/service-coordinator/login`
            : currentRole === 'fqc'
              ? `${API}/auth/fqc/login`
              : currentRole === 'pt'
                ? `${API}/auth/pt/login`
                : `${API}/auth/repair/login`;

      const res  = await fetch(endpoint, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ identifier: email, password: pass }),
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        // ── WRONG credentials ──
        emailEl.classList.add('err');
        passEl.classList.add('err');
        showMsg('✖ Wrong User Name or password. Please try again.', 'err');
        btn.disabled    = false;
        btn.textContent = btnLabel();
        return;
      }

      // ── SUCCESS ──
      const roleRaw = data.data.role || '';
      const role = roleRaw.toLowerCase();
      localStorage.setItem('schiller_token', data.data.token);
      localStorage.setItem('schiller_user',  JSON.stringify(data.data));
      localStorage.setItem('schiller_role',  role);

      showMsg(`&#10004; Welcome, ${_esc(data.data.name)}! Redirecting...`, 'ok');
      btn.innerHTML = '&#10004; Authenticated';

      setTimeout(() => {
        const redirectTarget = getRedirectForRole(role);
        if (role === 'employee') {
          const divisions = getAssignedDivisions(data.data);
          if (divisions.length > 1) {
            openDivisionChooser(data.data, redirectTarget || 'employee-dashboard.html');
            btn.disabled = false;
            btn.textContent = btnLabel();
            return;
          }
          const fallbackDivision = divisions[0] || String(data.data.division || '').trim();
          if (fallbackDivision) localStorage.setItem(ACTIVE_DIVISION_KEY, fallbackDivision);
        }

        if (redirectTarget) {
          window.location.href = redirectTarget;
        } else {
          showMsg('&#9888; Unknown role received from server: ' + role, 'err');
          btn.disabled    = false;
          btn.textContent = btnLabel();
        }
      }, 1000);

    } catch (e) {
      showMsg('&#9888; Cannot reach server. Please check the deployed backend and try again.', 'err');
      btn.disabled    = false;
      btn.textContent = btnLabel();
    }
  }

  /* ── Clear error on typing ── */
  ['f-email','f-pass'].forEach(id => {
    document.getElementById(id).addEventListener('input', clearErrors);
  });

  /* ── Enter key support ── */
  ['f-email','f-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
</script>
</body>
</html>
